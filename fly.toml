app = "cassandra-engine"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  CHAIN_NETWORK = "local"
  TICK_SECONDS = "120"
  DEMO_MODE = "true"
  REVEAL_DELAY_SECONDS = "0"
  COUNCIL_MAX_RUNS_PER_HOUR = "12"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[mounts]
  source = "cassandra_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpus = 1
